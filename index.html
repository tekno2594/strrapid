<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Video Player</title>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            background: #000;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            background: #000;
            object-fit: contain;
        }

        #error {
            display: none;
            position: fixed;
            left: 20px;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);

            padding: 20px;

            background: rgba(20,20,20,.95);
            color: white;

            border-radius: 10px;

            text-align: center;
            font-family: Arial, sans-serif;
        }
    </style>
</head>

<body>

<video
    id="video"
    controls
    playsinline
    preload="metadata">
</video>

<div id="error"></div>

<script>

const video = document.getElementById("video");
const errorBox = document.getElementById("error");

const params = new URLSearchParams(location.search);

const source = params.get("url");

let hls = null;


function error(message) {

    errorBox.textContent = message;
    errorBox.style.display = "block";

}


function isValidURL(value) {

    try {

        const url = new URL(value);

        return (
            url.protocol === "https:" ||
            url.protocol === "http:"
        );

    } catch {

        return false;

    }

}


function playHLS(url) {

    if (
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ) {

        video.src = url;

        video.play().catch(() => {});

        return;

    }


    if (!window.Hls) {

        error("HLS kütüphanesi yüklenemedi.");

        return;

    }


    if (!Hls.isSupported()) {

        error(
            "Bu tarayıcı HLS oynatmayı desteklemiyor."
        );

        return;

    }


    hls = new Hls({

        enableWorker: true,

        lowLatencyMode: false,

        backBufferLength: 90

    });


    hls.loadSource(url);

    hls.attachMedia(video);


    hls.on(
        Hls.Events.MANIFEST_PARSED,
        function () {

            video.play().catch(() => {});

        }
    );


    hls.on(
        Hls.Events.ERROR,
        function (event, data) {

            console.error(
                "HLS ERROR:",
                data
            );

            if (data.fatal) {

                error(
                    "HLS yayını oynatılamadı."
                );

            }

        }
    );

}


function playMP4(url) {

    video.src = url;

    video.play().catch(() => {});


    video.addEventListener(
        "error",
        function () {

            error(
                "Video dosyası oynatılamadı."
            );

        },
        {
            once: true
        }
    );

}


async function start() {

    if (!source) {

        error(
            "Video URL belirtilmedi."
        );

        return;

    }


    if (!isValidURL(source)) {

        error(
            "Geçersiz video URL'si."
        );

        return;

    }


    /*
     * URL uzantısından HLS/MP4 tespiti
     */

    const lower = source.toLowerCase();


    if (
        lower.includes(".m3u8")
    ) {

        playHLS(source);

        return;

    }


    if (
        lower.includes(".mp4") ||
        lower.includes(".webm") ||
        lower.includes(".ogg")
    ) {

        playMP4(source);

        return;

    }


    /*
     * Uzantı yoksa /api/video üzerinden
     * Content-Type tespiti yap.
     */

    try {

        const response = await fetch(
            "/api/video?url=" +
            encodeURIComponent(source)
        );


        if (!response.ok) {

            throw new Error(
                "HTTP " + response.status
            );

        }


        const contentType =
            response.headers.get(
                "content-type"
            ) || "";


        if (
            contentType.includes(
                "application/vnd.apple.mpegurl"
            ) ||
            contentType.includes(
                "application/x-mpegURL"
            )
        ) {

            playHLS(
                response.url
            );

            return;

        }


        if (
            contentType.startsWith(
                "video/"
            )
        ) {

            playMP4(
                response.url
            );

            return;

        }


        /*
         * Kaynak HTML ise video değildir.
         */

        error(
            "Verilen adres doğrudan video kaynağı değil."
        );

    } catch (e) {

        console.error(e);

        error(
            "Video kaynağına ulaşılamadı."
        );

    }

}


start();

</script>

</body>
</html>
