<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Video Player</title>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        #error {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            color: #fff;
            background: #000;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px;
        }
    </style>
</head>

<body>

<video
    id="video"
    controls
    playsinline
    preload="metadata">
</video>

<div id="error"></div>

<script>

const video = document.getElementById("video");
const errorBox = document.getElementById("error");

const params = new URLSearchParams(location.search);
const url = params.get("url");

let hls = null;


function showError(message) {

    errorBox.textContent = message;
    errorBox.style.display = "flex";

}


function playHLS(url) {

    /*
     * Safari / iOS
     */
    if (
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ) {

        video.src = url;

        video.play().catch(() => {});

        return;
    }


    /*
     * Chrome / Edge / Firefox
     */
    if (
        window.Hls &&
        Hls.isSupported()
    ) {

        hls = new Hls();

        hls.loadSource(url);
        hls.attachMedia(video);

        hls.on(
            Hls.Events.MANIFEST_PARSED,
            function () {

                video.play().catch(() => {});

            }
        );

        hls.on(
            Hls.Events.ERROR,
            function (event, data) {

                console.error(
                    "HLS error:",
                    data
                );

                if (data.fatal) {

                    showError(
                        "HLS yayını oynatılamadı."
                    );

                }

            }
        );

        return;
    }


    showError(
        "Bu tarayıcı HLS desteklemiyor."
    );
}


function playVideo(url) {

    video.src = url;

    video.play().catch(() => {});

    video.addEventListener(
        "error",
        function () {

            showError(
                "Video oynatılamadı. URL doğrudan MP4/WebM gibi bir medya kaynağı olmalı."
            );

        },
        {
            once: true
        }
    );
}


if (!url) {

    showError(
        "URL belirtilmedi."
    );

} else {

    const lowerURL =
        url.toLowerCase();


    /*
     * M3U8
     */
    if (
        lowerURL.includes(".m3u8")
    ) {

        playHLS(url);

    }

    /*
     * MP4 / WebM
     */
    else if (
        lowerURL.includes(".mp4") ||
        lowerURL.includes(".webm") ||
        lowerURL.includes(".ogg")
    ) {

        playVideo(url);

    }

    /*
     * Uzantısı olmayan kaynak
     */
    else {

        playVideo(url);

    }

}

</script>

</body>
</html>
