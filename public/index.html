<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Video Player</title>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            background: #000;
            object-fit: contain;
        }

        #status {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #fff;
            background: #000;
            font-family: Arial, sans-serif;
            font-size: 16px;
            text-align: center;
            z-index: 10;
        }
    </style>
</head>

<body>

<div id="status">Video hazırlanıyor...</div>

<video
    id="video"
    controls
    playsinline
    preload="metadata">
</video>

<script>

const video = document.getElementById("video");
const status = document.getElementById("status");

const params = new URLSearchParams(window.location.search);
const source = params.get("url");

let hls = null;

function showStatus(text) {
    status.textContent = text;
    status.style.display = "flex";
}

function hideStatus() {
    status.style.display = "none";
}

function isHLS(url) {
    return /\.m3u8($|[?#])/i.test(url);
}

function playHLS(url) {

    if (Hls.isSupported()) {

        hls = new Hls({
            enableWorker: true,
            lowLatencyMode: false
        });

        hls.loadSource(url);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, function () {
            hideStatus();
        });

        hls.on(Hls.Events.ERROR, function (event, data) {

            console.error("HLS error:", data);

            if (data.fatal) {

                showStatus(
                    "HLS video yüklenemedi. Kaynak CORS erişimine izin veriyor mu kontrol edin."
                );

                hls.destroy();
            }
        });

        return;
    }

    if (video.canPlayType("application/vnd.apple.mpegurl")) {

        video.src = url;

        video.addEventListener(
            "loadedmetadata",
            hideStatus,
            { once: true }
        );

        return;
    }

    showStatus("Bu tarayıcı HLS oynatmayı desteklemiyor.");
}

function playDirect(url) {

    video.src = url;

    video.addEventListener(
        "loadedmetadata",
        hideStatus,
        { once: true }
    );

    video.addEventListener(
        "error",
        function () {
            showStatus(
                "Video yüklenemedi. URL'nin doğrudan MP4/WebM/OGG dosyası olduğundan ve CORS erişiminin açık olduğundan emin olun."
            );
        },
        { once: true }
    );
}

if (!source) {

    showStatus(
        "URL belirtilmedi.<br><br>Örnek:<br>?url=https://site.com/video.mp4"
    );

} else {

    try {

        const parsed = new URL(source);

        if (
            parsed.protocol !== "http:" &&
            parsed.protocol !== "https:"
        ) {
            throw new Error("Invalid protocol");
        }

        if (isHLS(source)) {
            playHLS(source);
        } else {
            playDirect(source);
        }

    } catch (error) {

        console.error(error);

        showStatus("Geçersiz video URL'si.");
    }
}

</script>

</body>
</html>
